[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "function-approx-rl"
version = "0.1.0"
description = "Linear function approximation (tile coding) with semi-gradient SARSA on Mountain Car, a continuous-state control problem tabular methods can't represent."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
